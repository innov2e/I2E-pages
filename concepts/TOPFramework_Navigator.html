<title>TOPFramework Navigator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F3F5F4; --surface:#FFFFFF; --surface-2:#E9EEED;
  --ink:#122027; --ink-2:#44545B; --muted:#6F7E83; --line:#D8DFDE;
  --accent:#0E6E6A; --accent-ink:#0B5A57; --accent-soft:#D5EAE7; --on-accent:#FFFFFF;
  --ok:#2E7D4F; --ok-soft:#DCEFE3;
  --amber:#A86A00; --amber-soft:#F6EAD1;
  --bad:#B3402A; --bad-soft:#F6DED8;
  --paper:#FFFFFF; --paper-line:#E3E8E7;
  --display:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1618; --surface:#152023; --surface-2:#1C2A2D;
    --ink:#EDF3F2; --ink-2:#B3C1C3; --muted:#86999E; --line:#2A3B3F;
    --accent:#43B9AE; --accent-ink:#6FD0C6; --accent-soft:#17393A; --on-accent:#0B1517;
    --ok:#5CC98A; --ok-soft:#173326;
    --amber:#E3AE4A; --amber-soft:#3A2E15;
    --bad:#F08A73; --bad-soft:#3D221C;
    --paper:#18252A; --paper-line:#2A3B3F;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1618; --surface:#152023; --surface-2:#1C2A2D;
  --ink:#EDF3F2; --ink-2:#B3C1C3; --muted:#86999E; --line:#2A3B3F;
  --accent:#43B9AE; --accent-ink:#6FD0C6; --accent-soft:#17393A; --on-accent:#0B1517;
  --ok:#5CC98A; --ok-soft:#173326;
  --amber:#E3AE4A; --amber-soft:#3A2E15;
  --bad:#F08A73; --bad-soft:#3D221C;
  --paper:#18252A; --paper-line:#2A3B3F;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;padding-inline:clamp(16px,3vw,40px);padding-block:20px 40px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1400px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;border-bottom:1px solid var(--line);padding-bottom:14px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-weight:700;font-size:clamp(26px,3.2vw,40px);line-height:1.05;margin:4px 0 0;letter-spacing:-.01em;text-wrap:balance}
h1 span{color:var(--accent)}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}
.ghost{background:transparent;border:1px solid var(--line);border-radius:6px;padding:7px 12px;font-size:14px;color:var(--ink-2)}
.ghost:hover{border-color:var(--accent);color:var(--accent-ink)}

/* method map */
.map{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;min-width:0}
.mv{display:flex;flex-direction:column;gap:6px;flex:1 1 0;min-width:0}
.mv.ctx{flex:1 1 0}
.mv-h{font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.04em;text-transform:uppercase;color:var(--accent-ink);border-bottom:2px solid var(--accent);padding-bottom:3px;white-space:nowrap}
.mv.ctx .mv-h{color:var(--muted);border-color:var(--line)}
.mv-s{display:flex;gap:6px}
.chip{flex:1 1 0;min-width:0;overflow:hidden;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 9px;display:flex;flex-direction:column;gap:1px;line-height:1.2}
.chip .cn{font-family:var(--mono);font-size:11px;color:var(--muted)}
.chip .ct{font-family:var(--display);font-weight:600;font-size:15px}
.chip .cs{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.chip.full{border-color:var(--accent)}
.chip.adapted{border-color:var(--accent);border-style:dashed}
.chip.given,.chip.skip{background:transparent;border-style:dotted;cursor:default}
.chip.given .ct,.chip.skip .ct{color:var(--muted)}
.chip.given .ct{text-decoration:none}
.chip.skip .ct{text-decoration:line-through}
.chip.cur{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip.cur .cn,.chip.cur .cs{color:var(--on-accent);opacity:.85}
.chip.seen:not(.cur) .cs::after{content:" ✓"}

.main{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.1fr);gap:24px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:clamp(18px,2.4vw,30px);display:flex;flex-direction:column;gap:18px}
.stepline{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}
.stepline .sl{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink)}
.stepline .so{font-family:var(--mono);font-size:12px;color:var(--muted)}
.q{font-family:var(--display);font-weight:600;font-size:clamp(24px,2.4vw,32px);line-height:1.15;margin:0;text-wrap:balance}
.hint{color:var(--ink-2);margin:0;max-width:64ch}
.banner{border:1px dashed var(--accent);background:var(--accent-soft);color:var(--ink);border-radius:6px;padding:10px 14px;font-size:15px}
.banner b{color:var(--accent-ink)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.opt{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.opt:hover{border-color:var(--accent)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt .ot{font-family:var(--display);font-weight:600;font-size:19px}
.opt .od{font-size:14px;color:var(--ink-2)}
.opt .tag{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink)}
label.lab,.lab{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:6px}
textarea,input[type=text],select{width:100%;border:1px solid var(--line);border-radius:6px;padding:9px 12px;background:var(--bg);font-size:15px}
textarea{min-height:84px;resize:vertical;font-size:16px}

.rows{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.row .rt{font-weight:500}
.row .rs{font-family:var(--mono);font-size:12px;color:var(--muted)}
.row.off .rt{color:var(--muted)}
.row.wide{grid-template-columns:1fr}
.seg3{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;flex-wrap:wrap}
.seg3 button{border:0;background:transparent;padding:6px 10px;font-size:13px;color:var(--ink-2)}
.seg3 button+button{border-left:1px solid var(--line)}
.seg3 button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:600}
.seg3 button[aria-pressed="true"][data-v="ok"]{background:var(--ok-soft);color:var(--ok)}
.seg3 button[aria-pressed="true"][data-v="fix"]{background:var(--amber-soft);color:var(--amber)}
.seg3 button[aria-pressed="true"][data-v="no"]{background:var(--bad-soft);color:var(--bad)}
.req-flag{font-family:var(--mono);font-size:11px;color:var(--accent-ink);text-transform:uppercase;letter-spacing:.05em}
.ctxrow{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.ctxhead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center}
.ctxhead .t{font-weight:600}
.ctxhead .n{font-family:var(--mono);font-size:12px;color:var(--muted);margin-right:6px}

.switch{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.switch input{appearance:none;width:40px;height:22px;border-radius:11px;background:var(--line);position:relative;flex:none;margin-top:2px;transition:background .15s}
.switch input::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:var(--surface);top:3px;left:3px;transition:left .15s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{left:21px}

.callout{background:var(--surface-2);border-radius:6px;padding:12px 14px;font-size:15px;color:var(--ink-2)}
.callout b{color:var(--ink)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.dim{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.dot.ok{background:var(--ok)}.dot.fix{background:var(--amber)}.dot.no{background:var(--bad)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:4px;flex-wrap:wrap}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);border-radius:6px;padding:10px 18px;font-weight:600}
.btn.sec{background:transparent;color:var(--accent-ink)}
.btn:disabled{opacity:.4;cursor:default}

.sheet-wrap{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;flex-direction:column;gap:10px}
.sheet-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 12px;font-size:13px;font-family:var(--mono);color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.live-btn{border:1px dashed var(--accent);background:transparent;color:var(--accent-ink);border-radius:6px;padding:6px 12px;font-size:14px;font-weight:600}
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:4px;box-shadow:0 1px 0 var(--line),0 12px 32px -18px rgba(18,32,39,.35);padding:22px 24px;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 210px);overflow:auto}
.sh-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:10px}
.sh-head>div:first-child{flex:1 1 240px;min-width:0}
.sh-id{flex:0 0 auto;font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:flex-end;gap:2px;text-align:right}
.sh-title{font-family:var(--display);font-weight:700;font-size:22px;line-height:1.15;margin:2px 0 0}
.trail{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-family:var(--mono);font-size:11px}
.trail span{border:1px solid var(--line);border-radius:3px;padding:1px 5px;color:var(--muted)}
.trail span.full{border-color:var(--accent);color:var(--accent-ink)}
.trail span.adapted{border-color:var(--accent);border-style:dashed;color:var(--accent-ink)}
.trail span.given,.trail span.skip{border-style:dotted}
.trail span.skip{text-decoration:line-through}
.badge{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;font-weight:500;padding:4px 9px;border-radius:4px;text-transform:uppercase;letter-spacing:.05em}
.badge::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.fix{background:var(--amber-soft);color:var(--amber)}
.badge.no{background:var(--bad-soft);color:var(--bad)}
.fld{display:grid;grid-template-columns:150px minmax(0,1fr);gap:4px 16px;padding-bottom:11px;border-bottom:1px solid var(--paper-line)}
.fld:last-child{border-bottom:0}
.fk{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:3px;display:flex;flex-direction:column;gap:2px}
.fk .st{color:var(--accent-ink);letter-spacing:0;text-transform:none}
.bridge{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;border-left:3px solid var(--accent);padding:4px 0 4px 14px;font-size:14.5px}
.bridge .bk{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.bridge .bv{color:var(--ink-2)}
.bridge .bv.out{color:var(--accent-ink);font-family:var(--mono);font-size:13px}
.fv{font-size:15px}
.fv ul{margin:0;padding-left:18px}
.fv li+li{margin-top:2px}
.fv .src{font-size:12px;font-family:var(--mono);color:var(--accent-ink);margin-left:4px}
.fv .pend{color:var(--muted);font-style:italic}
.fv .sub{color:var(--ink-2)}
.fv .lvl{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:1px 5px;border-radius:3px;margin-right:6px}
.lvl.umana{background:var(--surface-2);color:var(--ink)}
.lvl.assistita{background:var(--accent-soft);color:var(--accent-ink)}
.lvl.delegata{background:var(--amber-soft);color:var(--amber)}
.meter{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:6px;max-width:260px}
.meter i{height:6px;border-radius:2px;background:var(--surface-2)}
.meter.s1 i:nth-child(1){background:var(--bad)}
.meter.s2 i:nth-child(-n+2){background:var(--amber)}
.meter.s3 i{background:var(--ok)}
.flash{animation:flash .9s ease-out}
@keyframes flash{from{background:var(--accent-soft)}to{background:transparent}}
.live-out h4{font-family:var(--display);font-size:17px;margin:10px 0 2px}
.live-out p{margin:4px 0}
.live-out ul{margin:4px 0;padding-left:18px}
.live-status{font-family:var(--mono);font-size:12px;color:var(--muted)}
.foot{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 20px;justify-content:space-between;border-top:1px solid var(--line);padding-top:12px}

@media (max-width:1000px){
  .main{grid-template-columns:1fr}
  .sheet-wrap{position:static}
  .sheet{max-height:none}
}
@media (max-width:640px){
  .fld{grid-template-columns:1fr}
  .row{grid-template-columns:1fr}
  .map{min-width:0}.mv{min-width:120px}
  .chip .ct{font-size:13px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* v4: dossier */
.sheet{position:relative;gap:14px}
.cap{font-size:13px;color:var(--ink-2);background:var(--surface-2);border-radius:4px;padding:8px 12px}
.trail span{cursor:pointer}
.trail span.cur{outline:2px solid var(--accent);outline-offset:1px}
.sum{border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.sum.cur,.osec.cur{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.sum h4,.osec h4{margin:0;font-family:var(--display);font-size:18px;font-weight:600}
.osec{border:1px solid var(--paper-line);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;transition:opacity .2s}
.dim-other .osec:not(.cur),.dim-other .sum:not(.cur){opacity:.55}
.dim-other .osec:not(.cur):hover,.dim-other .sum:not(.cur):hover{opacity:1}
.oh{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;justify-content:space-between}
.oh button{border:0;background:none;padding:0;text-align:left;cursor:pointer;color:inherit}
.oh .stag{font-family:var(--mono);font-size:12px;color:var(--accent-ink)}
.oh .stag:hover{text-decoration:underline}
.otitle{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.tw{overflow-x:auto}
table.kt{border-collapse:collapse;width:100%;font-size:13px;line-height:1.35}
table.kt th{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:500;border-bottom:1.5px solid var(--ink);padding:5px 6px;vertical-align:bottom}
table.kt td{border-bottom:1px solid var(--paper-line);padding:6px;vertical-align:top}
table.kt td.num{font-variant-numeric:tabular-nums;text-align:center;white-space:nowrap}
table.kt tr.off td{color:var(--muted)}
.kv{display:grid;grid-template-columns:minmax(110px,.4fr) 1fr;gap:0;font-size:13px}
.kv>div{padding:6px;border-bottom:1px solid var(--paper-line)}
.kv>div:nth-child(odd){font-family:var(--mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.chipst{display:inline-block;font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;padding:1px 6px;border-radius:3px;white-space:nowrap}
.chipst.ok{background:var(--ok-soft);color:var(--ok)}.chipst.fix{background:var(--amber-soft);color:var(--amber)}.chipst.no{background:var(--bad-soft);color:var(--bad)}.chipst.neu{background:var(--surface-2);color:var(--ink-2)}
.decision{border-left:3px solid var(--accent);padding:4px 10px;font-size:13.5px}
.pendbox{font-size:13px;color:var(--muted);font-style:italic}
.dots{letter-spacing:1px;color:var(--accent-ink);white-space:nowrap}
.checks{border:1px solid var(--line);border-radius:6px;padding:10px 14px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.checks ul{margin:0;padding-left:18px;color:var(--ink-2)}
.checks .lab{margin:0}
.bar5{display:inline-flex;gap:2px;vertical-align:middle}
.bar5 i{width:9px;height:9px;border-radius:2px;background:var(--surface-2);display:inline-block}
.bar5 i.on{background:var(--muted)}.bar5 i.tg{background:var(--accent)}
.flow{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12px}
.flow span{border:1px solid var(--line);border-radius:4px;padding:3px 7px;background:var(--surface)}
.flow b{color:var(--muted);font-weight:400}
body.wide .main{grid-template-columns:1fr}
body.wide #panel{display:none}
body.wide .sheet{max-height:none;padding:26px 32px}
body.wide table.kt{font-size:16px}
body.wide table.kt th{font-size:12px}
body.wide .kv{font-size:16px}
body.wide .osec h4,body.wide .sum h4{font-size:22px}
body.wide .sheet-wrap{position:static}
@media (max-height:820px) and (min-width:1001px){
  .top{padding-bottom:8px}
  .top .eyebrow{display:none}
  h1{font-size:28px}
  .chip{padding:4px 8px}
  .chip .cs{display:none}
  .wrap{gap:12px}
  body{padding-block:12px 24px}
  .sheet{max-height:calc(100vh - 150px)}
}

/* navigator */
.qcard{border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.qcard .qt{font-family:var(--display);font-weight:600;font-size:19px;line-height:1.2}
.qcard .qm{font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.ropts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.ropt{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:6px;padding:9px 12px;display:flex;flex-direction:column;gap:2px}
.ropt:hover{border-color:var(--accent)}
.ropt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.ropt b{font-weight:600;font-size:15px}
.ropt span{font-size:13px;color:var(--ink-2)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn.small,.ghost.small{padding:7px 12px;font-size:14px}
.busy{font-family:var(--mono);font-size:12px;color:var(--accent-ink)}
.errmsg{font-size:14px;color:var(--bad)}
.privacy{font-size:13px;color:var(--amber);background:var(--amber-soft);border-radius:4px;padding:6px 10px}
.form2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.savest{font-family:var(--mono);font-size:11.5px;color:var(--muted);order:2;flex:1 1 100%}
table.kt td[contenteditable="true"]:empty::after{content:"…";color:var(--muted)}
table.kt td{min-width:60px}
table.kt td[contenteditable="true"]{outline:none;cursor:text}
table.kt td[contenteditable="true"]:hover{background:var(--surface-2)}
table.kt td[contenteditable="true"]:focus{background:var(--accent-soft)}
.addrow{border:1px dashed var(--line);background:transparent;border-radius:4px;font-size:12px;padding:3px 8px;color:var(--muted);align-self:flex-start}
.addrow:hover{border-color:var(--accent);color:var(--accent-ink)}
.drawer{position:fixed;inset:0;background:rgba(10,20,24,.45);display:flex;justify-content:flex-end;z-index:10}
.drawer[hidden]{display:none!important}
.drawer .dpanel{background:var(--surface);width:min(460px,100%);height:100%;padding:calc(env(safe-area-inset-top,0px) + 20px) 20px 20px;display:flex;flex-direction:column;gap:12px;overflow:auto}
.caseitem{border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.caseitem.cur{border-color:var(--accent);background:var(--accent-soft)}
.caseitem .ct2{font-weight:600}
.caseitem .cd{font-family:var(--mono);font-size:11px;color:var(--muted)}
.synth h4{font-family:var(--display);font-size:17px;margin:10px 0 2px}
.synth p{margin:4px 0;font-size:14.5px}
.synth ul{margin:4px 0;padding-left:18px;font-size:14.5px}

.brand{display:flex;align-items:center;gap:18px}
.brand a.logo{flex:none;display:block;line-height:0;border-radius:4px}
.brand a.logo img{height:64px;width:auto;display:block}
.brand a.logo:hover img{opacity:.8}
.wm{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:5}
.wm img{width:min(52vw,560px);height:auto;opacity:.05}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .brand a.logo img, :root:not([data-theme="light"]) .wm img{filter:brightness(0) invert(1)} }
:root[data-theme="dark"] .brand a.logo img, :root[data-theme="dark"] .wm img{filter:brightness(0) invert(1)}
@media (max-width:640px){ .brand a.logo img{height:44px} }
</style>

const el = (tag, attrs={}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, "");
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k.nodeType ? k : document.createTextNode(k));
  return e;
};

const METHOD_TXT = () => [1,2,3,4,5,6,7,8,9].map(n => `S${n} ${M[n].name}: ${M[n].q.it} Output: ${M[n].out.map(o=>o.t.it).join(" + ")}`).join("\n");
function caseTxt(){
  return [`Titolo: ${C.title}`, `Organizzazione: ${C.org}`, `Settore: ${C.sector}`, `Funzione o processo: ${C.func}`, `Descrizione: ${C.desc}`, `Obiettivo: ${C.goal}`, `Già deciso: ${C.decided}`].join("\n");
}
function prevTxt(upTo){
  const parts = [];
  for (let n = 1; n <= 9; n++){
    if (n >= upTo) break;
    if (!worked(n)){ parts.push(`S${n}: ${t(MODES[C.modes[n]].n)} — ${reasonOf(n)}`); continue; }
    const outs = C.outputs[n]; if (!outs) continue;
    parts.push(`S${n} ${M[n].name}${C.summaries[n] ? " — sintesi: " + C.summaries[n] : ""}`);
    outs.forEach(o => { parts.push(`  [${o.title}] ${o.columns.join(" | ")}`); o.rows.slice(0,10).forEach(r => parts.push("   - " + r.join(" | "))); });
  }
  const s = parts.join("\n"); return s.length > 14000 ? s.slice(0, 14000) + "\n…" : s;
}
function answersTxt(n){
  const qs = C.questions[n] || [], ans = C.answers[n] || {};
  const lines = qs.map((q,i) => { const a = ans[i] || {}; const sel = (a.sel||[]).map(j => q.options[j]?.label).filter(Boolean); return `D: ${q.text}\nR: ${sel.join("; ") || "—"}`; });
  if ((C.notes[n]||"").trim()) lines.push("Note del gruppo: " + C.notes[n].trim());
  return lines.join("\n");
}

async function callJson(prompt){

}
function errFor(e){ if (e && e.code === "invalid_json") return tr("errJson"); const m = U.errGen[e && e.code] || U.errGen.other; return t(m); }
async function runBusy(kind, fn){
  if (!sample) return;
  busy = kind; errText = ""; renderPanel();
  try { await fn(); } catch (e) { errText = errFor(e); if (e && ["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(e.code)) sample = null; }

}

function proposePath(){
  return runBusy("path", async () => {
    const prompt = `Sei un facilitatore esperto del metodo TOPFramework (C. M. Poli). Il metodo ha 9 step in 5 movimenti (Capire, Scegliere, Costruire, Eseguire, Consolidare):\n${METHOD_TXT()}\n\nNon sempre si percorrono tutti gli step: se l'organizzazione ha già deciso qualcosa (per policy, scelte di gruppo, piattaforme esistenti) lo step è "given"; se serve solo una parte è "adapted"; se non serve al caso è "skip"; altrimenti "full". Il metodo si adatta al caso, non il contrario.\n\nCaso:\n${caseTxt()}\n\nPer ogni step decidi lo stato e scrivi in ${langName()} un motivo breve (max 25 parole) e una frase "applied" (max 25 parole) che dica come si applica lo step a questo caso. Rispondi solo con JSON: {"steps":[{"n":1,"mode":"full|adapted|given|skip","reason":"...","applied":"..."}, ...9 elementi]}`;
    const r = await callJson(prompt);
    const arr = Array.isArray(r?.steps) ? r.steps : [];
    arr.forEach(s => { const n = Number(s.n); if (n>=1 && n<=9 && MODES[s.mode]){ C.modes[n] = s.mode; C.reasons[n] = String(s.reason||""); C.applied[n] = String(s.applied||""); } });
    if (!arr.length) throw { code:"invalid_json" };
  });
}
function genQuestions(n){
  return runBusy("q"+n, async () => {
    const prompt = `Sei un facilitatore del metodo TOPFramework e prepari il lavoro di un'aula di manager.\nStep ${n}: ${M[n].name}. Domanda guida del metodo: "${M[n].q.it}". Output da produrre: ${M[n].out.map(o=>o.t.it).join(" + ")}.\nStato dello step: ${C.modes[n]}${C.modes[n]==="adapted" ? " (lavorare solo quanto indicato: " + reasonOf(n) + ")" : ""}.\n\nCaso:\n${caseTxt()}\n\nOutput degli step precedenti:\n${prevTxt(n) || "nessuno"}\n\nScrivi in ${langName()}: una frase "applied" (max 25 parole) su come si applica lo step a questo caso; poi 2 o 3 domande concrete per il gruppo, specifiche del caso, che servono a compilare gli output. Per ogni domanda da 3 a 5 scelte plausibili e diverse tra loro (label max 8 parole, detail max 20 parole) e il tipo: "single" se si sceglie una sola risposta, "multi" se più. Non inventare numeri. Rispondi solo con JSON: {"applied":"...","questions":[{"text":"...","type":"single","options":[{"label":"...","detail":"..."}]}]}`;
    const r = await callJson(prompt);
    const qs = (Array.isArray(r?.questions) ? r.questions : []).slice(0,3).map(q => ({ text:String(q.text||""), type:q.type === "multi" ? "multi" : "single",
      options:(Array.isArray(q.options)?q.options:[]).slice(0,5).map(o => ({ label:String(o.label||""), detail:String(o.detail||"") })).filter(o => o.label) })).filter(q => q.text && q.options.length);
    if (!qs.length) throw { code:"invalid_json" };
    C.questions[n] = qs; C.answers[n] = {}; if (r.applied) C.applied[n] = String(r.applied);
  });
}

function genOutputs(n){

    const r = await callJson(prompt);

$("#btnCloseDrawer").addEventListener("click", () => { $("#drawer").hidden = true; });
$("#drawer").addEventListener("click", e => { if (e.target.id === "drawer") $("#drawer").hidden = true; });
$("#btnNew").addEventListener("click", () => { const c = blankCase(); loadCase(c); touch(); });
$("#btnWide").addEventListener("click", () => { document.body.classList.toggle("wide"); lastScrolled = null; renderStatic(); renderSheet(); });
$("#btnExportHtml").addEventListener("click", () => saveFile(fname(".html"), dossierHtml()));
$("#btnExportJson").addEventListener("click", () => saveFile(fname(".json"), JSON.stringify(C, null, 2)));
$("#fileImport").addEventListener("change", async e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  try { const obj = JSON.parse(await f.text()); if (!obj || typeof obj !== "object" || !obj.modes) throw 0; obj.id = obj.id || uid(); loadCase(obj); touch(); }
  catch { errText = tr("importErr"); renderPanel(); }
  e.target.value = "";
});
$("#btnFull").addEventListener("click", async () => { try { if (document.fullscreenElement) await document.exitFullscreen(); else await document.documentElement.requestFullscreen(); } catch { $("#btnFull").hidden = true; } });
document.addEventListener("keydown", e => {
  if (e.key === "Escape") $("#drawer").hidden = true;
  const tag = (e.target && e.target.tagName) || "";
  if (tag === "TEXTAREA" || tag === "INPUT" || tag === "SELECT" || (e.target && e.target.isContentEditable)) return;
  if (e.key === "ArrowRight") step(1);
  if (e.key === "ArrowLeft") step(-1);
});

/* restore a local draft if there is one */
try { const raw = localStorage.getItem("topf-nav-case"); if (raw) { const c = JSON.parse(raw); if (c && c.modes) { C = normalize(c); seen = Object.assign({ ctx:true }, C.seen || {}); } } } catch {}
setSave(tr("saveLocal"));
renderAll();

(async () => {
  if (!(window.claude && typeof window.claude.use === "function")) return;
  try {
    const [s, d, u, dl] = await Promise.all([window.claude.use("sample"), window.claude.use("db"), window.claude.use("user"), window.claude.use("downloads")]);
    sample = s || null; downloads = dl || null;
    if (d && u){ const id = await u.id(); if (id){ db = d; userId = id; persist = "cloud";
      const items = await listCases();
      if (items.length && items[0] && items[0].modes && !C.updatedAt_loadedFromCloud){ C = normalize(items[0]); seen = Object.assign({ ctx:true }, C.seen || {}); }
      setSave(tr("saveCloud")); } }
  } catch {}
  renderAll();
})();
})();
</script>
